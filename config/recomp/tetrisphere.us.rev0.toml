# N64Recomp template for the confirmed NTPE rev0 initial image.
# tools/recomp/generate.py replaces the two REQUIRED sentinels in a private
# runtime copy after validating the exact ROM and output paths.
[input]
entrypoint = 0x80025C50
symbols_file_path = "symbols.toml"
rom_file_path = "ROM_PATH_REQUIRED"
output_func_path = "OUTPUT_PATH_REQUIRED"
single_file_output = false
functions_per_output_file = 50
uses_mips3_float_mode = false
recomp_include = "#include \"tetrisphere/recomp_support.h\""

[patches]
stubs = []
ignored = [
    "tetrisphere_osInitialize",
    "tetrisphere_osPiRawReadIo",
    "tetrisphere_osCreateThread",
    "tetrisphere_osStartThread",
    "tetrisphere_wait_retraces",
    "tetrisphere_osSetWatchLo",
    "tetrisphere_osClearWatch",
    "tetrisphere_osProbeTLB",
    "tetrisphere_osExceptionDispatch",
    "tetrisphere_osExceptionResume",
    "tetrisphere_osSetCompare",
]
renamed = []

[[patches.hook]]
func = "func_8006F894"
before_vram = 0x8006F914
text = "tetrisphere_rescue_pause_snapshot_hook(rdram, ctx);"

